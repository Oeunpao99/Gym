server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SSE endpoint needs buffering disabled and a long read timeout - the connection
    # stays open indefinitely, only pinged every 25s by the backend, so the default
    # 60s proxy_read_timeout would silently kill it in production only (dev's Vite
    # server doesn't proxy this at all, so this bug would never show up outside prod).
    location /api/tv/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
